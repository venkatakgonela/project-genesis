[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "project-genesis"
version = "0.1.0"
description = "AI-EOS generator — bootstrap and maintain AI Engineering Operating Systems for software projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
keywords = ["ai", "engineering", "scaffolding", "cli", "ai-eos"]
dependencies = [
    "typer>=0.12",
    "jinja2>=3.1",
]

[project.scripts]
genesis = "genesis.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "black>=24.0",
    "isort>=5.13",
    "mypy>=1.10",
]

# ---------------------------------------------------------------------------
# Hatchling — include templates bundled inside the package
# ---------------------------------------------------------------------------
[tool.hatch.build.targets.wheel]
packages = ["genesis"]

# ---------------------------------------------------------------------------
# Ruff
# ---------------------------------------------------------------------------
[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

# ---------------------------------------------------------------------------
# Black
# ---------------------------------------------------------------------------
[tool.black]
line-length = 88
target-version = ["py312"]

# ---------------------------------------------------------------------------
# isort
# ---------------------------------------------------------------------------
[tool.isort]
profile = "black"
line_length = 88

# ---------------------------------------------------------------------------
# Mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# Pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
